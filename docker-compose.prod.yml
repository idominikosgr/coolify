version: '3.8'

# Production Docker Compose Override
# This file extends docker-compose.yml with production-specific configurations
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  coolify:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  coolify-worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: always
    profiles: []  # Enable worker in production
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  coolify-db:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    # Persistent volume for production
    volumes:
      - coolify-db-data:/var/lib/postgresql/data
      - ./backups:/backups

  coolify-redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
